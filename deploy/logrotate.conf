# Logrotate configuration for Telemetry Agent and Exporter
/var/log/telemetry-agent.log
/var/log/telemetry-exporter.log {
    # Rotate files daily
    daily
    
    # Keep 7 days worth of backlogged logs
    rotate 7
    
    # Compress rotated files using gzip
    compress
    
    # Postpone compression to next cycle to avoid locking files while active
    delaycompress
    
    # Do not error if log file is missing
    missingok
    
    # Do not rotate empty logs
    notifempty
    
    # Truncate original log file in-place after creating copy
    # This is essential since services write continuously and copytruncate avoids restarting them
    copytruncate
    
    # Trigger rotation immediately if log size exceeds 10MB
    size 10M
}
